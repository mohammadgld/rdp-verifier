<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f8f7" />
    <title>RDP Verifier</title>
    <link rel="stylesheet" href="/app.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none"><rect x="4.5" y="6.5" width="23" height="16" rx="3" stroke="currentColor" stroke-width="2"/><path d="M11 27h10M16 22.5V27" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="14.5h.01M15 14.5h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
          <span>RDP Verifier</span>
        </div>
      </header>

      <div class="workspace">
        <section class="card input-card" aria-labelledby="input-title">
          <div class="section-heading"><h2 id="input-title">Targets</h2></div>

          <label class="file-picker file-button" for="fileInput" role="button" tabindex="0">
            <span class="file-picker-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M16 21V7m0 0-5 5m5-5 5 5M6 21v3a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3v-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span class="file-picker-title">IP list</span>
            <span class="file-picker-action">Choose file</span>
            <span id="fileName" class="file-name" aria-live="polite">No file selected</span>
          </label>
          <input id="fileInput" type="file" hidden />

          <div class="settings">
            <div class="setting">
              <label for="concurrency">Concurrent checks</label>
              <div class="number-field"><input id="concurrency" type="number" min="1" max="3000" step="1" value="32" inputmode="numeric" /><span>threads</span></div>
            </div>
          </div>

          <div class="actions">
            <button id="startButton" class="button button-primary" type="button">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z" fill="currentColor"/></svg>
              Start scan
            </button>
            <button id="cancelButton" class="button button-danger" type="button" hidden>Stop</button>
          </div>
          <p id="message" class="message" role="status" aria-live="polite"></p>
        </section>

        <section class="card results-card" aria-labelledby="results-title">
          <div class="section-heading results-heading">
            <h2 id="results-title">Verified RDP</h2>
            <span id="matchCount" class="count-badge">0 found</span>
          </div>

          <div id="progressArea" class="progress-area" hidden>
            <div class="progress-meta">
              <span class="working-status"><span class="working-indicator" aria-hidden="true"></span><span id="scanStatus">Scanning…</span></span>
              <span class="progress-values"><strong id="progressPercent">0.0%</strong><span id="progressNumbers">0 / 0</span></span>
            </div>
            <div class="progress-track" role="progressbar" aria-label="Scan progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack"><span id="progressFill"></span></div>
          </div>

        </section>
      </div>
    </main>
  </body>
</html>
